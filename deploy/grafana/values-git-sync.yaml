# Helm values for the official Grafana chart (grafana/grafana)
# Enables automatic dashboard synchronization from Git using git-sync.
#
# Install/upgrade command:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   helm upgrade --install grafana grafana/grafana -f deploy/grafana/values-git-sync.yaml

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'SmartHome'
        orgId: 1
        folder: 'SmartHome'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards-git/current/dashboards
          foldersFromFilesStructure: false

extraVolumes:
  - name: git-dashboards
    emptyDir: {}

extraVolumeMounts:
  - name: git-dashboards
    mountPath: /var/lib/grafana/dashboards-git
    readOnly: true

extraContainers:
  - name: git-sync-dashboards
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    imagePullPolicy: IfNotPresent
    args:
      - --repo=https://github.com/bkielbasa/smarthome-metrics.git
      - --ref=master
      - --period=30s
      - --root=/git
      - --link=current
      - --one-time=false
    # For private repositories, uncomment and configure credentials secret:
    # env:
    #   - name: GITSYNC_USERNAME
    #     valueFrom:
    #       secretKeyRef:
    #         name: git-credentials
    #         key: username
    #   - name: GITSYNC_PASSWORD
    #     valueFrom:
    #       secretKeyRef:
    #         name: git-credentials
    #         key: token
    volumeMounts:
      - name: git-dashboards
        mountPath: /git
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      runAsUser: 65533
      runAsGroup: 65533
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
